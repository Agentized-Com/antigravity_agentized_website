<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Card Positioner</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #222; font-family: monospace; }
#toolbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
    background: #111; color: #fff; padding: 10px 16px;
    display: flex; align-items: center; gap: 16px; font-size: 13px;
}
#toolbar button {
    background: #f59e0b; color: #000; border: none; padding: 8px 16px;
    border-radius: 6px; cursor: pointer; font-weight: 700; font-size: 13px;
}
#output {
    position: fixed; top: 50px; right: 0; width: 340px; bottom: 0; z-index: 999;
    background: #1a1a1a; color: #0f0; font-size: 11px; padding: 12px;
    overflow-y: auto; white-space: pre; border-left: 2px solid #333;
}
#stage {
    position: relative;
    margin-top: 50px;
    margin-right: 340px;
}
#stage img { display: block; width: 100%; }
.card {
    position: absolute;
    background: rgba(255,255,255,0.97);
    border-radius: 10px;
    border: 2px solid transparent;
    cursor: move;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    box-shadow: 0 2px 14px rgba(0,0,0,0.15);
    user-select: none;
    overflow: hidden;
}
.card:hover, .card.active { border-color: #f59e0b; }
.card .card-icon { color: #f59e0b; font-size: 1.4rem; flex-shrink: 0; }
.card h4 { font-size: 0.72rem; font-weight: 800; text-transform: uppercase; color: #111; margin-bottom: 2px; line-height: 1.2; }
.card p { font-size: 0.65rem; color: #555; line-height: 1.3; margin: 0; }
.card::after { content: ''; display: block; width: 20px; height: 2px; background: #f59e0b; position: absolute; bottom: 8px; left: 60px; }
.resize-handle {
    position: absolute; bottom: 0; right: 0;
    width: 14px; height: 14px; cursor: se-resize;
    background: #f59e0b; border-radius: 2px 0 10px 0;
    opacity: 0.7;
}
</style>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<div id="toolbar">
    <span>Drag cards to position. Drag ▼ corner to resize.</span>
    <button onclick="copyCSS()">Copy CSS</button>
    <span id="hint" style="color:#aaa;"></span>
</div>

<div id="output"></div>

<div id="stage">
    <img src="HERO.png" id="hero" alt="">
</div>

<script>
const cards = [
    { id:'L1', side:'left',  n:1, icon:'fa-receipt',         title:'Bookkeeping Automation',       desc:'Automate bank feeds, categorization, reconciliations, and more.' },
    { id:'L2', side:'left',  n:2, icon:'fa-chart-line',       title:'Financial Reporting',           desc:'Real-time P&L, balance sheets, cash flow, and custom reports.' },
    { id:'L3', side:'left',  n:3, icon:'fa-shield-halved',    title:'Risk & Fraud Monitoring',       desc:'Monitor anomalies and surface risks early with AI.' },
    { id:'L4', side:'left',  n:4, icon:'fa-users',            title:'Vendor & Bill Operations',      desc:'Streamline approvals, payments, and vendor communications.' },
    { id:'L5', side:'left',  n:5, icon:'fa-chart-pie',        title:'Expense Management',            desc:'Track, categorize, and optimize company spending.' },
    { id:'R1', side:'right', n:1, icon:'fa-arrow-trend-up',   title:'Forecasting & Planning',        desc:'AI-powered forecasts to guide smarter financial decisions.' },
    { id:'R2', side:'right', n:2, icon:'fa-building-columns', title:'Cash Flow Visibility',          desc:'Gain real-time visibility into cash flow and liquidity.' },
    { id:'R3', side:'right', n:3, icon:'fa-bullseye',         title:'Opportunity Analysis',          desc:'Evaluate opportunities and prioritize what drives value.' },
    { id:'R4', side:'right', n:4, icon:'fa-lock',             title:'Compliance & Audit Support',    desc:'Stay audit-ready with automated logs and documentation.' },
    { id:'R5', side:'right', n:5, icon:'fa-circle-nodes',     title:'Operations & Data Consolidation', desc:'Consolidate operations and data across systems and functions.' },
];

// Default positions (% of stage)
const defaults = {
    L1:{ top:9,  left:1,  w:20, h:13 },
    L2:{ top:28, left:1,  w:20, h:13 },
    L3:{ top:47, left:1,  w:20, h:13 },
    L4:{ top:63, left:1,  w:20, h:13 },
    L5:{ top:76, left:1,  w:20, h:13 },
    R1:{ top:9,  right:1, w:20, h:13 },
    R2:{ top:28, right:1, w:20, h:13 },
    R3:{ top:46, right:1, w:20, h:13 },
    R4:{ top:61, right:1, w:20, h:13 },
    R5:{ top:74, right:1, w:20, h:13 },
};

const stage = document.getElementById('stage');
const state = {};

cards.forEach(c => {
    const d = defaults[c.id];
    const el = document.createElement('div');
    el.className = 'card';
    el.id = 'card-' + c.id;
    el.innerHTML = `
        <div class="card-icon"><i class="fas ${c.icon}"></i></div>
        <div><h4>${c.title}</h4><p>${c.desc}</p></div>
        <div class="resize-handle"></div>
    `;
    // Store state as % of stage
    state[c.id] = { top: d.top, w: d.w, h: d.h, side: c.side, n: c.n };
    if (c.side === 'left')  state[c.id].left  = d.left;
    else                    state[c.id].right = d.right;

    applyState(el, c.id);
    stage.appendChild(el);
    makeDraggable(el, c.id);
});

function applyState(el, id) {
    const s = state[id];
    const sw = stage.offsetWidth || 1;
    const sh = stage.offsetHeight || 1;
    el.style.top    = (s.top / 100 * sh) + 'px';
    el.style.width  = (s.w   / 100 * sw) + 'px';
    el.style.height = (s.h   / 100 * sh) + 'px';
    if (s.side === 'left') {
        el.style.left  = (s.left  / 100 * sw) + 'px';
        el.style.right = 'auto';
    } else {
        el.style.right = (s.right / 100 * sw) + 'px';
        el.style.left  = 'auto';
    }
}

function makeDraggable(el, id) {
    const handle = el.querySelector('.resize-handle');
    let dragging = false, resizing = false, startX, startY, startTop, startLeft, startRight, startW, startH;

    el.addEventListener('mousedown', e => {
        if (e.target === handle) return;
        dragging = true;
        el.classList.add('active');
        startX = e.clientX; startY = e.clientY;
        startTop = el.offsetTop; startLeft = el.offsetLeft;
        e.preventDefault();
    });

    handle.addEventListener('mousedown', e => {
        resizing = true;
        el.classList.add('active');
        startX = e.clientX; startY = e.clientY;
        startW = el.offsetWidth; startH = el.offsetHeight;
        e.preventDefault(); e.stopPropagation();
    });

    document.addEventListener('mousemove', e => {
        const sw = stage.offsetWidth, sh = stage.offsetHeight;
        if (dragging) {
            const dx = e.clientX - startX, dy = e.clientY - startY;
            const newTop  = startTop  + dy;
            const newLeft = startLeft + dx;
            el.style.top  = newTop  + 'px';
            if (state[id].side === 'left') {
                el.style.left = newLeft + 'px';
                state[id].left = newLeft / sw * 100;
            } else {
                const newRight = sw - newLeft - el.offsetWidth;
                el.style.right = newRight + 'px';
                el.style.left  = 'auto';
                state[id].right = newRight / sw * 100;
            }
            state[id].top = newTop / sh * 100;
            updateOutput();
        }
        if (resizing) {
            const nw = Math.max(80, startW + e.clientX - startX);
            const nh = Math.max(40, startH + e.clientY - startY);
            el.style.width  = nw + 'px';
            el.style.height = nh + 'px';
            state[id].w = nw / sw * 100;
            state[id].h = nh / sh * 100;
            updateOutput();
        }
    });

    document.addEventListener('mouseup', () => {
        dragging = resizing = false;
        el.classList.remove('active');
    });
}

function pct(n) { return n.toFixed(1) + '%'; }

function updateOutput() {
    let css = '';
    const leftCards  = Object.entries(state).filter(([id]) => id.startsWith('L')).sort((a,b)=>a[1].top-b[1].top);
    const rightCards = Object.entries(state).filter(([id]) => id.startsWith('R')).sort((a,b)=>a[1].top-b[1].top);

    // Width/height (use first left card as reference for simplicity)
    const s0 = leftCards[0][1];
    css += `/* Card size: ${pct(s0.w)} wide, ${pct(s0.h)} tall */\n\n`;

    leftCards.forEach(([id, s], i) => {
        css += `.hero-cards-left .hero-card:nth-child(${i+1})  { top: ${pct(s.top)}; }\n`;
    });
    css += '\n';
    rightCards.forEach(([id, s], i) => {
        css += `.hero-cards-right .hero-card:nth-child(${i+1}) { top: ${pct(s.top)}; }\n`;
    });

    // Widths
    css += `\n/* widths (left / right) */\n`;
    leftCards.forEach(([id, s], i) => {
        css += `.hero-cards-left .hero-card:nth-child(${i+1})  { width: ${pct(s.w)}; height: ${pct(s.h)}; }\n`;
    });
    rightCards.forEach(([id, s], i) => {
        css += `.hero-cards-right .hero-card:nth-child(${i+1}) { width: ${pct(s.w)}; height: ${pct(s.h)}; }\n`;
    });

    document.getElementById('output').textContent = css;
}

function copyCSS() {
    const text = document.getElementById('output').textContent;
    navigator.clipboard.writeText(text).then(() => {
        document.getElementById('hint').textContent = '✓ Copied!';
        setTimeout(() => document.getElementById('hint').textContent = '', 2000);
    });
}

// Wait for image to load to get correct stage height
document.getElementById('hero').addEventListener('load', updateOutput);
window.addEventListener('resize', () => {
    cards.forEach(c => applyState(document.getElementById('card-'+c.id), c.id));
    updateOutput();
});
updateOutput();
</script>
    <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
